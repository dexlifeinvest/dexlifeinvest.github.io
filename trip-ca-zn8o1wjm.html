<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>加拿大旅行手冊</title>
<meta name="description" content="2026/10/20–11/1 加拿大 12 日遊每日手冊：行程、必帶、景點、餐飲、注意事項、英文與即時天氣、極光 Kp。">
<meta name="theme-color" content="#1d5b3c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f2; --surface:#ffffff; --ink:#15302b; --muted:#5b6f6b; --line:#d3dedb;
  --sign:#1d5b3c; --sign-ink:#ffffff; --lake:#14838a; --lake-soft:#dff0ef;
  --maple:#b8402c; --maple-soft:#f8e4df; --aurora:#2f9e6a; --gold:#9a6b12;
  --radius-s:6px; --radius-m:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1820; --surface:#14232d; --ink:#e3ece9; --muted:#93a8a3; --line:#25404a;
    --sign:#1d5b3c; --sign-ink:#ffffff; --lake:#4fc1c6; --lake-soft:#163640;
    --maple:#f08a74; --maple-soft:#3a2420; --aurora:#6fdc9f; --gold:#e2b45a;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1820; --surface:#14232d; --ink:#e3ece9; --muted:#93a8a3; --line:#25404a;
  --sign:#1d5b3c; --sign-ink:#ffffff; --lake:#4fc1c6; --lake-soft:#163640;
  --maple:#f08a74; --maple-soft:#3a2420; --aurora:#6fdc9f; --gold:#e2b45a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC",system-ui,sans-serif;}
a{color:var(--lake);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--lake);outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* top bar */
.top{background:var(--sign);color:var(--sign-ink);padding:14px 0 10px}
.top .wrap{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;justify-content:space-between}
.top h1{margin:0;font:900 1.25rem/1.2 "Noto Serif TC",serif;letter-spacing:.04em}
.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.src-link{white-space:nowrap;color:inherit;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:2px 10px;font-size:.78rem}
.src-link:hover{background:rgba(255,255,255,.12)}
.clocks{display:flex;gap:14px;font-size:.82rem;opacity:.92}
.clocks b{font-weight:700;font-variant-numeric:tabular-nums}
.theme-btn{white-space:nowrap;background:none;border:1px solid rgba(255,255,255,.5);color:inherit;border-radius:999px;padding:2px 10px;font:inherit;font-size:.78rem;cursor:pointer}
.status{font-size:.85rem;opacity:.9;width:100%}

/* day strip */
nav.days{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.days .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
nav.days .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.88rem;cursor:pointer;line-height:1.3;text-align:center}
.tab small{display:block;font-size:.7rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--sign);border-color:var(--sign);color:#fff}
.tab[aria-selected="true"] small{color:#d6eadf}
.tab.today{box-shadow:inset 0 0 0 2px var(--gold)}

/* highway sign header: the one memorable element */
.sign{margin:20px 0 16px;background:var(--sign);color:var(--sign-ink);border-radius:14px;padding:6px}
.sign-in{border:2px solid rgba(255,255,255,.9);border-radius:10px;padding:14px 16px 16px}
.sign .when{font-size:.9rem;opacity:.9}
.sign h2{margin:2px 0 6px;font:900 clamp(1.5rem,6vw,2.1rem)/1.25 "Noto Serif TC",serif;letter-spacing:.03em}
.sign .route{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-weight:700}
.sign .route span.arrow{opacity:.75}
.sign .stay{margin-top:10px;font-size:.88rem;opacity:.95}
.sign .stay a{color:#fff}

/* glance row */
.glance{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:620px){.glance.two{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px}
.panel h3{margin:0 0 6px;font-size:1rem}
.wx-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wx-temp{font:900 1.9rem/1 "Noto Serif TC",serif;font-variant-numeric:tabular-nums}
.wx-meta{color:var(--muted);font-size:.86rem}
.hint{color:var(--muted);font-size:.86rem;margin:6px 0 0}
.kp-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.kp{flex:1 1 60px;border-radius:var(--radius-s);padding:6px 8px;background:var(--lake-soft);font-size:.8rem;text-align:center}
.kp b{display:block;font:900 1.3rem/1.2 "Noto Serif TC",serif}
.kp.hi{background:var(--aurora);color:#04150c}
.clouds{display:flex;gap:3px;margin-top:8px;align-items:flex-end;height:54px}
.clouds div{flex:1;background:var(--muted);opacity:.35;border-radius:3px 3px 0 0;position:relative;min-height:3px}
.clouds div.clear{background:var(--aurora);opacity:1}
.cloud-axis{display:flex;gap:3px;font-size:.66rem;color:var(--muted)}
.cloud-axis span{flex:1;text-align:center}

/* sections */
section.block{margin:26px 0}
section.block > h3{font:900 1.15rem/1.3 "Noto Serif TC",serif;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:4.6rem 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.timeline .t{font-weight:700;color:var(--lake);font-variant-numeric:tabular-nums;font-size:.92rem;padding-top:1px}
.badge{display:inline-block;font-size:.72rem;padding:0 7px;border-radius:999px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.badge.book{background:var(--lake-soft);color:var(--lake);border:1px solid var(--lake)}
.badge.fly{background:var(--sign);color:#fff}
.badge.warn{background:var(--maple-soft);color:var(--maple);border:1px solid var(--maple)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;cursor:pointer;border-radius:6px}
.checks input{width:20px;height:20px;margin-top:3px;accent-color:var(--sign);flex:none}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.places{display:grid;gap:10px}
.place{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}
.place .n{font-weight:700}
.place .d{font-size:.9rem;color:var(--muted);margin-top:2px}
.place .map{font-size:.85rem;white-space:nowrap}
.place header{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.notes li{padding:10px 12px;border-left:4px solid var(--maple);background:var(--maple-soft);border-radius:0 var(--radius-s) var(--radius-s) 0;font-size:.95rem}
.notes li.info{border-left-color:var(--lake);background:var(--lake-soft)}

/* english */
.vocab{width:100%;border-collapse:collapse;font-size:.92rem}
.vocab td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.vocab td.en{font-weight:700;width:38%}
.vocab td.use{color:var(--muted);font-size:.84rem}
.say{border:none;background:var(--lake-soft);color:var(--lake);border-radius:999px;width:28px;height:28px;cursor:pointer;flex:none;font-size:.85rem;line-height:28px;padding:0}
.phr{display:grid;gap:8px}
.phr div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:9px 12px;display:flex;gap:10px;align-items:flex-start}
.phr .ctx{font-size:.8rem;color:var(--muted)}
.phr .s{font-weight:500}
details.more{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:4px 12px}
details.more summary{cursor:pointer;padding:6px 0;font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;text-decoration:none}
.linkgroup{margin-bottom:18px}
.linkgroup h4{margin:0 0 8px;font-size:.95rem}
.search{width:100%;font:inherit;padding:10px 12px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:12px}
.wordhead{font-weight:700;margin:16px 0 4px;color:var(--lake);font-size:.9rem}
footer{color:var(--muted);font-size:.8rem;padding:30px 0 50px}
.progress{font-size:.85rem;color:var(--muted);margin:-4px 0 8px}
@media (prefers-reduced-motion: no-preference){
  .sign{animation:signIn .35s ease-out}
  @keyframes signIn{from{transform:translateY(-6px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
</head>

  <div class="wrap">
    <div class="title-row">
      <h1>加拿大旅行手冊</h1>
      <a class="src-link" href="https://drive.google.com/file/d/1AlmE_YlrsNhbpeuSHhgtEeit6BCn3inM/view" target="_blank" rel="noopener">參考原始檔 ↗</a>

function statusLine(){
  const today = dateIn("America/Vancouver");
  const start = new Date("2026-10-20T00:00:00+08:00");
  const day = DAYS.find(d => d.date === today);
  if (day) return `今天是 Day ${day.n}：${day.title}`;
  const diff = Math.ceil((start - new Date()) / 86400000);
  if (diff > 0) return `距離出發還有 ${diff} 天`;
  return "旅程結束，歡迎回家";
}

/* ---------- speech ---------- */
let voice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => v.lang === "en-CA") || vs.find(v => v.lang === "en-US") || vs.find(v => /^en/.test(v.lang)) || null;
  }catch(e){}
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g, ", "));
  u.lang = "en-CA"; u.rate = 0.9; if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}
const sayBtn = t => `<button class="say" type="button" data-say="${esc(t)}" aria-label="唸出 ${esc(t)}">▶</button>`;

  const done = items.filter((_,i) => checks[key+i]).length;
  return `<p class="progress">${done}／${items.length} 已完成</p><ul class="checks">` + items.map((t,i) => {
    const id = key + i;
    return `<li><label><input type="checkbox" data-check="${id}" ${checks[id]?"checked":""}><span>${esc(t)}</span></label></li>`;
  }).join("") + `</ul>`;
}

  return `<div class="places">` + list.map(([n,d,q]) =>

function searchVocab(q){
  q = q.trim().toLowerCase();
  const out = $("#qres"); if (!out) return;
  if (!q){ out.innerHTML = `<p class="hint">輸入關鍵字，會從每天的單字和句子裡找。</p>`; return; }
  let words = [], phr = [];
  VOCAB.forEach(s => {
    s.words.forEach(w => { if (w.join(" ").toLowerCase().includes(q)) words.push(w); });
    s.phrases.forEach(p => { if (p.join(" ").toLowerCase().includes(q)) phr.push(p); });
  });
  out.innerHTML = (!words.length && !phr.length) ? `<p class="hint">找不到「${esc(q)}」，換個字試試。</p>`
    : (phr.length ? phraseList(phr.slice(0,30)) + `<div style="height:12px"></div>` : "") + (words.length ? vocabTable(words.slice(0,60)) : "");
}

/* ---------- live data ---------- */
const WMO = {0:"晴",1:"大致晴",2:"局部多雲",3:"陰",45:"霧",48:"霧凇",51:"毛毛雨",53:"毛毛雨",55:"毛毛雨",56:"凍毛雨",57:"凍毛雨",61:"小雨",63:"雨",65:"大雨",66:"凍雨",67:"凍雨",71:"小雪",73:"雪",75:"大雪",77:"米雪",80:"陣雨",81:"陣雨",82:"強陣雨",85:"陣雪",86:"強陣雪",95:"雷雨",96:"雷雨冰雹",99:"雷雨冰雹"};
const wxCache = {};
async function getWx(key){
  if (wxCache[key]) return wxCache[key];
  const c = CITY[key];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset&hourly=cloud_cover,temperature_2m&timezone=${encodeURIComponent(c.tz)}&forecast_days=16`;
  wxCache[key] = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  return wxCache[key];
}
async function fillWx(d){
  const box = $("#wx"); if (!box) return;
  const c = CITY[d.wx];
  const ecLink = d.wx==="yk"?L.ecyk:(["banff","canmore","louise"].includes(d.wx)?L.ecbanff:L.ecvan);
  try{
    const j = await getWx(d.wx);
    const i = j.daily.time.indexOf(d.date);
    if (i < 0){
      const past = d.date < j.daily.time[0];
      box.innerHTML = `<h3>${esc(c.name)}天氣</h3><p class="hint">${past?"這一天已經過了。":"預報只到 16 天後，這天還沒開放。"}到時再打開這頁就會自動顯示。</p><p class="hint"><a href="${ecLink[1]}" target="_blank" rel="noopener">${ecLink[0]}</a></p>`;
      return;
    }
    const D = j.daily, t = s => s.slice(11,16);
    box.innerHTML = `<h3>${esc(c.name)}天氣</h3>
      <div class="wx-main"><span class="wx-temp">${Math.round(D.temperature_2m_min[i])}° / ${Math.round(D.temperature_2m_max[i])}°C</span><span>${WMO[D.weather_code[i]]||""}</span></div>
      <div class="wx-meta">降雨機率 ${D.precipitation_probability_max[i] ?? "–"}%｜最大風速 ${Math.round(D.wind_speed_10m_max[i])} km/h｜日出 ${t(D.sunrise[i])}｜日落 ${t(D.sunset[i])}</div>
      <p class="hint"><a href="${ecLink[1]}" target="_blank" rel="noopener">看加拿大氣象局完整預報</a></p>`;
  }catch(e){
    box.innerHTML = `<h3>${esc(c.name)}天氣</h3><p class="hint">目前抓不到預報，可能沒有網路。可以改看 <a href="${ecLink[1]}" target="_blank" rel="noopener">${ecLink[0]}</a>。</p>`;
  }
}
let kpCache = null;
async function getKp(){
  if (!kpCache) kpCache = fetch("https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  return kpCache;
}
function kpRows(j){
  if (!Array.isArray(j)) return [];
  if (Array.isArray(j[0])) return j.slice(1).map(r => ({t:r[0], kp:parseFloat(r[1])}));
  return j.map(r => ({t:r.time_tag, kp:parseFloat(r.kp ?? r.Kp)}));
}
async function fillAurora(d){
  const box = $("#aur"); if (!box) return;
  const isYK = d.aurora === "yk";
  let html = `<h3>今晚極光</h3>`;
  try{
    const rows = kpRows(await getKp()).filter(r => !isNaN(r.kp));
    // night window local 20:00–03:00 MDT = 02:00–09:00 UTC next day
    const next = new Date(d.date + "T00:00:00Z"); next.setUTCDate(next.getUTCDate()+1);
    const nd = next.toISOString().slice(0,10);
    const night = rows.filter(r => { const s = r.t.replace(" ","T"); return s.startsWith(nd) && +s.slice(11,13) <= 9; });
    if (night.length){
      const max = Math.max(...night.map(r => r.kp));
      const need = isYK ? 2 : 5;
      html += `<div class="kp-row">` + night.map(r => {
        const h = +r.t.replace(" ","T").slice(11,13), local = ((h - 6) + 24) % 24;
        return `<div class="kp ${r.kp>=need?"hi":""}">${String(local).padStart(2,"0")}:00<b>${r.kp.toFixed(1)}</b></div>`;
      }).join("") + `</div><p class="hint">當地時間的 Kp 預報，最高 ${max.toFixed(1)}。${isYK ? "黃刀鎮在極光帶正下方，Kp 1–2 就看得到，晴不晴比 Kp 重要。" : "班夫緯度較低，大約要 Kp 5 才有機會，綠色格子是有希望的時段。"}</p>`;
    } else {
      html += `<p class="hint">NOAA 只預報 3 天內的 Kp，這晚還沒開放。</p>`;
    }
  }catch(e){
    html += `<p class="hint">抓不到 Kp 預報，請改看下方連結。</p>`;
  }
  try{
    const j = await getWx(d.wx === "banff" ? "banff" : "yk");
    const H = j.hourly; const out = [];
    for (let k = 0; k < H.time.length; k++){
      const t = H.time[k], day = t.slice(0,10), hr = +t.slice(11,13);
      const nextDay = new Date(d.date+"T00:00:00Z"); nextDay.setUTCDate(nextDay.getUTCDate()+1);
      if ((day === d.date && hr >= 20) || (day === nextDay.toISOString().slice(0,10) && hr <= 2)) out.push([hr, H.cloud_cover[k], H.temperature_2m[k]]);
    }
    if (out.length){
      const minT = Math.min(...out.map(o => o[2]));
      html += `<p class="hint" style="margin-top:10px">雲量 20:00–02:00（綠色＝雲量 30% 以下）。最低約 ${Math.round(minT)}°C。</p>
        <div class="clouds" aria-hidden="true">${out.map(o => `<div class="${o[1]<=30?"clear":""}" style="height:${Math.max(4,o[1])}%" title="${o[1]}%"></div>`).join("")}</div>
        <div class="cloud-axis">${out.map(o => `<span>${o[0]}</span>`).join("")}</div>
        <p class="hint">${out.map(o=>`${o[0]}點 ${o[1]}%`).join("、")}</p>`;
    }
  }catch(e){}
  html += `<p class="hint"><a href="${L.astro[1]}" target="_blank" rel="noopener">夜間雲量</a>｜<a href="${L.swpc[1]}" target="_blank" rel="noopener">NOAA 極光</a>｜<a href="${L.swl[1]}" target="_blank" rel="noopener">SpaceWeatherLive</a></p>`;
  box.innerHTML = html;
}

/* ---------- tabs ---------- */
const PAGES = [PRE, ...DAYS, LINKS];
function buildTabs(){
  const today = dateIn("America/Vancouver");
  $("#tabs").innerHTML = PAGES.map(p => {
    const isDay = !!p.date;
    const label = isDay ? p.date.slice(5).replace("-","/") : p.tab;
    const sub = isDay ? `Day ${p.n}` : p.sub;
    return `<button class="tab ${isDay && p.date===today ? "today":""}" role="tab" id="tab-${p.id}" aria-controls="main" aria-selected="false" data-id="${p.id}">${label}<small>${sub}</small></button>`;
  }).join("");
}
function show(id, focus){
  const p = PAGES.find(x => x.id === id) || PRE;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.id === p.id ? "true" : "false"));
  const btn = $("#tab-"+p.id); if (btn) btn.scrollIntoView({inline:"center", block:"nearest"});
  const main = $("#main");
  main.innerHTML = p === PRE ? renderPre() : p === LINKS ? renderLinks() : renderDay(p);
  if (p.date){ fillWx(p); fillAurora(p); }
  if (p === LINKS){ searchVocab(""); $("#q").addEventListener("input", e => searchVocab(e.target.value)); }
  store.set("ca26-tab", p.id);
  if (location.hash !== "#"+p.id) history.replaceState(null, "", "#"+p.id);
  if (focus) main.focus({preventScroll:true});
  window.scrollTo({top:0});
}

document.addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (t){ show(t.dataset.id, true); return; }
  const s = e.target.closest("[data-say]"); if (s){ say(s.dataset.say); }
});
document.addEventListener("change", e => {
  const c = e.target.closest("[data-check]"); if (!c) return;
  checks[c.dataset.check] = c.checked; store.set("ca26-checks", checks);
  const ul = c.closest("ul.checks"), p = ul && ul.previousElementSibling;
  if (p && p.classList.contains("progress")){
    const all = ul.querySelectorAll("input"), done = [...all].filter(i => i.checked).length;
    p.textContent = `${done}／${all.length} 已完成`;
  }
});
$("#tabs").addEventListener("keydown", e => {
  if (!["ArrowRight","ArrowLeft"].includes(e.key)) return;
  const tabs = [...document.querySelectorAll(".tab")], i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  const n = tabs[(i + (e.key==="ArrowRight"?1:-1) + tabs.length) % tabs.length];
  n.focus(); show(n.dataset.id, false);
});
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nx; store.set("ca26-theme", nx);
});
window.addEventListener("hashchange", () => show(location.hash.slice(1), false));

(function init(){
  const th = store.get("ca26-theme", null); if (th) document.documentElement.dataset.theme = th;
  buildTabs(); tick(); setInterval(tick, 30000);
  $("#status").textContent = statusLine();
  const today = DAYS.find(d => d.date === dateIn("America/Vancouver"));
  const start = location.hash.slice(1) || (today && today.id) || store.get("ca26-tab", "pre");
  show(start, false);
})();
</script>
